services:
  - type: web
    name: otto-api
    runtime: docker
    plan: free
    region: ohio
    branch: master
    repo: https://github.com/Jddumas/Otto-Support-Assistant.git
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_VERIFY_SSL
        value: "true"
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: CLASSIFY_MODEL
        value: llama-3.1-8b-instant
      - key: EMBED_PROVIDER
        value: fastembed
      - key: EMBED_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: DATABASE_URL
        fromDatabase:
          name: otto-db
          property: connectionString
      - key: PGHOST
        fromDatabase:
          name: otto-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: otto-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: otto-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: otto-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: otto-db
          property: password
      - key: CORS_ORIGINS
        value: "*"
      - key: CHECKPOINT_DB
        value: data/checkpoints.sqlite
      - key: MAX_INPUT_LENGTH
        value: "2000"
      - key: API_RATE_LIMIT
        value: 10/minute
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: otto-db
    databaseName: support_agent
    user: agent
    plan: free
